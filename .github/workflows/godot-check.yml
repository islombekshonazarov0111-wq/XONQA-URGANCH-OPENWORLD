name: Godot Project Check

on:
  push:
    branches: [full-game]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --editor --path . --import

      - name: Check main scene
        run: godot --headless --path . --quit-after 60
